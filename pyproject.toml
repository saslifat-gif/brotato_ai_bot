[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brotato-ai"
version = "4.0.0"
description = "Typed live-control, recording, replay, and evaluation runtime for Brotato"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "torch>=2.2",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3,<3",
    "sb3-contrib>=2.3,<3",
    "tensorboard>=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
ocr = [
    "winrt-runtime>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2; sys_platform == 'win32'",
]

[project.scripts]
brotato-ai = "v4.cli:main"

[tool.setuptools]
package-dir = {"" = "src", "v4" = "v4"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["brotato_ai", "brotato_ai.*", "v4", "v4.*"]
namespaces = false

[tool.setuptools.package-data]
v4 = ["mod/**/*"]


