name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Check installed CLI and bridge resources
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          brotato-ai --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from importlib.resources import files; import v4.env.brotato_api_env; assert (files('v4') / 'mod/Lifat-BrotatoRLBridge/bridge.gd').is_file()"

      - name: Run unit tests
        shell: pwsh
        run: |
          pytest
